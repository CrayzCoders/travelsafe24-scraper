name: Scrape and publish listings

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      attempt:
        description: "Retry attempt number (internal — leave as 1 for manual runs)"
        default: "1"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium headless shell
        run: pnpm exec playwright install chromium-headless-shell --with-deps

      - name: Run scraper
        env:
          SCRAPE_MAX_PAGES: ${{ secrets.SCRAPE_MAX_PAGES }}
        run: pnpm scrape

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp data/listings.json _site/listings.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  retry-on-failure:
    needs: scrape
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Re-dispatch workflow on a fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
          MAX_ATTEMPTS: "3"
          RETRY_DELAY_SECONDS: "30"
        run: |
          if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            echo "Reached max attempts ($MAX_ATTEMPTS). Not retrying."
            exit 0
          fi
          NEXT=$((ATTEMPT + 1))
          echo "Scrape failed on attempt $ATTEMPT. Waiting ${RETRY_DELAY_SECONDS}s then re-dispatching as attempt $NEXT..."
          sleep "$RETRY_DELAY_SECONDS"
          gh workflow run scrape.yml --ref "${{ github.ref_name }}" -f attempt="$NEXT"

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
